<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Demo Màn Chơi Trong Game (In-Game Screen Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: {
              950: '#11100e',
              900: '#181614',
              850: '#221f1b',
              800: '#2f2b25',
              700: '#443e35',
              600: '#5c5448',
              300: '#dcd5c8',
              100: '#f8f4ec',
            },
            amberInk: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            vermilion: {
              400: '#fb7185',
              500: '#e11d48',
              600: '#be123c',
            },
            jade: {
              400: '#34d399',
              500: '#10b981',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            hanzi: ['"Noto Serif SC"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Tactile UI */
    .tactile-hud-btn {
      transition: all 0.08s ease-in-out;
      box-shadow: 0 2px 0 0 #2f2b25;
    }
    .tactile-hud-btn:hover {
      border-color: #f59e0b;
      transform: translateY(-1px);
    }
    .tactile-hud-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 0 transparent;
    }

    /* Word Falling Glow & Box */
    .falling-target {
      box-shadow: 0 8px 24px -4px rgba(245, 158, 11, 0.25), 0 0 0 1px #f59e0b;
    }

    /* Laser Line */
    .laser-beam {
      background: linear-gradient(to top, rgba(245, 158, 11, 0.8), rgba(245, 158, 11, 0));
    }
  </style>
</head>
<body class="bg-[#11100e] text-[#ece6da] min-h-screen flex flex-col font-sans overflow-hidden select-none">

  <!-- TOP BAR: BẢNG SO SÁNH / SWITCH VIEW -->
  <div class="bg-paper-950 border-b border-paper-800 px-4 py-2 flex items-center justify-between text-xs z-50">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-amberInk-500 animate-ping"></span>
      <span class="font-display font-bold text-amberInk-400">DEMO IN-GAME HUD & CANVAS</span>
      <span class="text-stone-500 hidden sm:inline">• Phong cách Arcade Warm Ink & Typography</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="demo-style.html" class="text-stone-400 hover:text-amberInk-400 transition-colors">
        ← Xem màn hình chính (Menu Home)
      </a>
    </div>
  </div>

  <!-- IN-GAME SIMULATION CONTAINER -->
  <div class="relative flex-1 w-full bg-[#131210] overflow-hidden flex flex-col justify-between">
    
    <!-- Background Grid / Warm Particle Canvas Simulation -->
    <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#f59e0b 1px, transparent 1px); background-size: 32px 32px;"></div>

    <!-- 1. TOP HUD (REPLACES GENERIC CYAN SLATE-900) -->
    <div class="relative z-30 px-4 sm:px-6 py-3 flex items-center justify-between pointer-events-auto">
      
      <!-- Left: Home + HP Bar + HSK Badge -->
      <div class="flex items-center gap-2.5">
        <button class="tactile-hud-btn bg-paper-900 border border-paper-800 text-stone-300 hover:text-white p-2.5 rounded-xl cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        </button>

        <!-- Health / HP Bar với màu Đỏ Sơn Mài (Vermilion) -->
        <div class="bg-paper-900 border border-paper-800 rounded-xl px-3.5 py-1.5 flex items-center gap-3 shadow-md">
          <div class="w-3.5 h-3.5 text-vermilion-500 font-bold">♥</div>
          <div class="flex flex-col">
            <div class="flex justify-between items-center text-[10px] font-mono tracking-wider text-stone-400">
              <span class="uppercase">SINH LỰC</span>
              <span class="text-stone-200 font-bold ml-3">80/100</span>
            </div>
            <div class="w-24 sm:w-32 h-1.5 bg-paper-950 rounded-full overflow-hidden mt-1 border border-paper-800/80">
              <div class="h-full bg-vermilion-500 rounded-full transition-all" style="width: 80%;"></div>
            </div>
          </div>
        </div>

        <!-- HSK Badge kiểu Keycap máy arcade -->
        <div class="bg-paper-900 border border-paper-800 rounded-xl px-3 py-1.5 text-xs font-mono font-bold text-amberInk-400 hidden sm:flex items-center gap-1.5 shadow-md">
          <span class="text-stone-500 font-normal">HSK</span>
          <span>1</span>
        </div>
      </div>

      <!-- Center: Score & Combo Dập Nổi -->
      <div class="flex items-center gap-3.5 bg-paper-900 border border-paper-800 px-5 py-1.5 rounded-xl shadow-md">
        <div class="flex flex-col items-center">
          <span class="text-[9px] font-display uppercase tracking-widest text-stone-400">ĐIỂM SỐ</span>
          <span class="text-base sm:text-lg font-mono font-bold text-white tracking-wider leading-tight">
            1,420
          </span>
        </div>

        <div class="pl-3 border-l border-paper-800 flex flex-col items-center">
          <span class="text-[9px] font-display uppercase tracking-widest text-amberInk-400">COMBO</span>
          <span class="text-sm sm:text-base font-mono font-extrabold text-amberInk-400 leading-tight">
            x8 🔥
          </span>
        </div>
      </div>

      <!-- Right Controls: Phím cơ xúc giác -->
      <div class="flex items-center gap-2">
        <button class="tactile-hud-btn bg-paper-900 border border-paper-800 text-stone-300 hover:text-white p-2 rounded-xl flex items-center gap-1.5 cursor-pointer">
          <span class="text-amberInk-400 text-xs">🔊</span>
          <span class="text-[10px] font-mono text-stone-400 hidden md:inline">Space</span>
        </button>

        <button class="tactile-hud-btn bg-paper-900 border border-paper-800 text-stone-300 hover:text-white p-2 rounded-xl flex items-center gap-1.5 cursor-pointer">
          <span class="text-stone-300 text-xs">⏸</span>
          <span class="text-[10px] font-mono text-stone-400 hidden md:inline">Esc</span>
        </button>

        <button class="tactile-hud-btn bg-paper-900 border border-paper-800 text-stone-300 hover:text-white p-2 rounded-xl cursor-pointer">
          <span class="text-stone-300 text-xs">⚙️</span>
        </button>
      </div>
    </div>

    <!-- 2. IN-GAME CANVAS SIMULATION: CÁC TỪ ĐANG RƠI (WORD ENTITIES) -->
    <div class="relative flex-1 w-full max-w-4xl mx-auto px-4">
      
      <!-- Word 1: Từ đang được gõ trúng (Active Locked Target) -->
      <div class="absolute left-1/2 -translate-x-1/2 top-28 flex flex-col items-center z-20">
        <!-- Target indicator arrow -->
        <div class="text-amberInk-400 text-xs animate-bounce mb-1">▼ TARGET LOCKED</div>

        <div class="falling-target bg-paper-900/95 border-2 border-amberInk-500 rounded-2xl px-6 py-3.5 flex flex-col items-center backdrop-blur-md">
          <!-- Chữ Hán to bản bằng Noto Serif SC thanh nhã -->
          <div class="font-hanzi font-black text-3xl sm:text-4xl text-[#fbf8f3] tracking-wide mb-1">
            你好
          </div>

          <!-- Cloze Pinyin đang gõ trúng: ký tự gõ đúng màu Amber, ký tự chưa gõ mờ -->
          <div class="font-mono text-base sm:text-lg tracking-wider flex items-center gap-1.5">
            <span class="font-bold text-amberInk-400 bg-amberInk-500/20 px-1.5 py-0.5 rounded">nǐ</span>
            <span class="font-bold text-amberInk-400 bg-amberInk-500/20 px-1.5 py-0.5 rounded">h</span>
            <span class="text-stone-500 border-b-2 border-stone-600 px-1">ǎ</span>
            <span class="text-stone-500 border-b-2 border-stone-600 px-1">o</span>
          </div>

          <!-- Nghĩa tiếng Việt & Hán Việt -->
          <div class="mt-2 text-xs text-stone-300 flex items-center gap-2">
            <span class="text-stone-400 font-medium">Xin chào</span>
            <span class="text-[10px] text-stone-500 font-mono">[Nễ Hảo]</span>
          </div>
        </div>

        <!-- Laser Beam từ súng bắn lên từ mục tiêu -->
        <div class="w-0.5 h-48 laser-beam mt-1"></div>
      </div>

      <!-- Word 2: Từ phụ bên cạnh (Chưa khóa mục tiêu) -->
      <div class="absolute right-12 top-16 hidden sm:flex flex-col items-center opacity-85">
        <div class="bg-paper-900/85 border border-paper-800 rounded-xl px-4 py-2.5 flex flex-col items-center shadow-lg">
          <div class="font-hanzi font-black text-2xl text-stone-200 mb-0.5">
            谢谢
          </div>
          <div class="font-mono text-xs text-stone-400 tracking-wider">
            xièxie
          </div>
          <div class="text-[11px] text-stone-500 mt-1">
            Cảm ơn
          </div>
        </div>
      </div>

      <!-- Word 3: Từ phụ bên trái -->
      <div class="absolute left-12 top-36 hidden sm:flex flex-col items-center opacity-70">
        <div class="bg-paper-900/85 border border-paper-800 rounded-xl px-4 py-2.5 flex flex-col items-center shadow-lg">
          <div class="font-hanzi font-black text-2xl text-stone-200 mb-0.5">
            再见
          </div>
          <div class="font-mono text-xs text-stone-400 tracking-wider">
            zàijiàn
          </div>
          <div class="text-[11px] text-stone-500 mt-1">
            Tạm biệt
          </div>
        </div>
      </div>

    </div>

    <!-- 3. BOTTOM CANNON & TYPING INPUT PROMPT (THAY CHO NỀN ĐEN PHẲNG) -->
    <div class="relative z-30 pb-4 pt-2 flex flex-col items-center">
      
      <!-- Pháo đài / Turret kiểu Cơ Khí / Tactile Cannon -->
      <div class="relative flex flex-col items-center mb-2">
        <div class="w-8 h-8 rounded-full bg-amberInk-500 border-2 border-amberInk-400 shadow-lg flex items-center justify-center">
          <div class="w-3 h-3 rounded-full bg-paper-950"></div>
        </div>
        <div class="w-16 h-2 bg-paper-800 rounded-t-lg mt-1 border-t border-paper-700"></div>
      </div>

      <!-- Khung hiển thị Input đang gõ (Mechanical Input Box) -->
      <div class="w-full max-w-sm px-4">
        <div class="bg-paper-900 border-2 border-paper-750 rounded-xl p-2.5 flex items-center justify-between shadow-xl">
          <div class="flex items-center gap-2">
            <span class="font-mono text-xs text-stone-500 uppercase font-bold">GÕ:</span>
            <span class="font-mono text-base font-bold text-amberInk-400 tracking-wider">nih</span>
            <span class="w-2 h-4 bg-amberInk-400 animate-pulse inline-block"></span>
          </div>
          <span class="text-[10px] font-mono text-stone-500 bg-paper-950 px-2 py-0.5 rounded border border-paper-800">
            Pinyin Tự Do
          </span>
        </div>
      </div>

      <!-- Quick Shortcut Keys Helper -->
      <div class="mt-2 text-[11px] font-mono text-stone-400 flex items-center gap-3">
        <span><kbd class="px-1.5 py-0.5 bg-paper-850 border border-paper-700 rounded text-stone-300 font-bold">Space</kbd> Nghe lại âm</span>
        <span class="text-stone-700">•</span>
        <span><kbd class="px-1.5 py-0.5 bg-paper-850 border border-paper-700 rounded text-stone-300 font-bold">Esc</kbd> Tạm dừng</span>
      </div>
    </div>

  </div>

</body>
</html>
